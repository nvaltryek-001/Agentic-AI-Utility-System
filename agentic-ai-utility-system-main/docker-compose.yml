services:
backend:
build: ./backend
container_name: valtryek_backend
ports:
- "5000:5000"
volumes:
- ./backend:/app
depends_on:
- mongo

frontend:
build: ./frontend
container_name: valtryek_frontend
ports:
- "5173:5173"
volumes:
- ./frontend:/app
environment:
- VITE_API_URL=http://localhost:5000

mongo:
image: mongo
container_name: valtryek_mongo
ports:
- "27017:27017"
volumes:
- mongo_data:/data/db

volumes:
mongo_data:
